# Design example, NOT a host import format or an enforcing policy.
# Configure all null fields and approve a protected policy before autonomous use.
schema_version: surgical-dev-goal-driven
project_id: UNCONFIGURED
policy_revision: draft-v1
automation_enabled: false
profile: DRAFT_ONLY
policy_authority_reference: null
repository: null
coding_runtime: null
workflow_owner: host_native  # Or runtime_owned, never two competing controllers.

role_destinations:
  product_scout: null
  worker: null
  verifier: null

concurrency:
  max_active_projects_per_repo: 1
  max_active_workers: 2  # Includes integration, delivery and incident executions.
  max_active_verifiers: 1
  max_total_active_executions: 4  # All active role/helper executions combined.
  max_active_integrations_per_target: 1
  max_active_releases_per_environment: 1
  temporary_subagents_enabled: false
  max_active_subagents_project: 2  # Not multiplied by the Worker count.
  recursive_delegation: false
  serial_fallback: true

organization:
  decomposition_owner: worker
  assignment_owner: verified_controller
  integration_owner: worker_assignment
  routine_technical_plan_approval: false
  require_acyclic_dependencies: true
  require_dependency_snapshots: true
  require_isolated_write_workspaces: true
  require_write_and_resource_claims: true
  require_independent_project_acceptance: true
  allow_scope_or_budget_expansion: false

budgets:
  max_review_repair_cycles: 2
  max_transient_retries: 3
  total_elapsed_seconds: null  # Must be finite and user-approved for unattended work.
  max_runtime_invocations: null  # Set an approved count/usage ceiling.
  cost_visibility: UNKNOWN

scope:
  allowed_write_paths: []
  permitted_check_commands: []
  required_checks: []
  required_check_policy_revision: null
  default_delivery_target: PR_READY

permissions:
  internal_handoffs: false
  launch_task_sessions: false  # Requires a real supported host and explicit activation.
  paid_execution: false
  push_task_branch: false
  create_draft_pr: false
  merge: false
  create_tag_or_release: false
  publish_package: false
  deploy_preview: false
  deploy_production: false
  rollback: false
  create_persistent_agents: false
  modify_skills_or_scheduled_jobs: false
  delete_data: false
  change_permissions_or_gate_policy: false

sensitive_change_classes:
  - authentication_or_authorization
  - payments
  - destructive_data_operations
  - database_migrations
  - production_secrets
  - public_api_compatibility
  - ci_or_gate_configuration
  - irreversible_release

release:
  trusted_executor_reference: null
  environments: []
  artifact_provenance_source: null
  observation_checks: []
  observation_window_seconds: null
  recovery_runbook_reference: null
  rollback_reversibility_verified: false

approvals:
  grant_source: null
  grant_expiry: null
  revocation_source: null
  kill_switch_reference: null

# Empty commands/checks/environments do NOT mean permissive defaults.
# They mean incomplete setup. No credentials or self-authored approved=true flag.
