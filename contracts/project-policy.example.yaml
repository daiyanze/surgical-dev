# Design example, NOT a Grok/Pi import format or an enforcing policy.
# Configure all null fields and approve a protected policy before autonomous use.
schema_version: surgeon-design-v2
project_id: UNCONFIGURED
policy_revision: draft-v1
automation_enabled: false
profile: DRAFT_ONLY
policy_authority_reference: null
repository: null
coding_runtime: null
workflow_owner: grok_native  # v2 Grok pilot; runtime_owned is a later alternative.

role_destinations:
  product_scout: null
  engineer: null
  verifier: null
  operator: null

concurrency:
  max_active_parent_write_tasks_per_repo: 1
  max_active_releases_per_environment: 1
  temporary_subagents_enabled: false
  max_concurrent_subagents_when_enabled: 2
  recursive_delegation: false

budgets:
  max_review_repair_cycles: 2
  max_transient_retries: 3
  total_elapsed_seconds: null  # Must be finite and user-approved for unattended work.
  max_runtime_invocations: null  # Set an approved count/usage ceiling.
  cost_visibility: UNKNOWN

scope:
  allowed_write_paths: []
  permitted_check_commands: []
  required_checks: []
  required_check_policy_revision: null
  default_delivery_target: PR_READY

permissions:
  internal_handoffs: false
  paid_execution: false
  push_task_branch: false
  create_draft_pr: false
  merge: false
  create_tag_or_release: false
  publish_package: false
  deploy_preview: false
  deploy_production: false
  rollback: false
  create_persistent_bots: false
  modify_skills_or_routines: false
  delete_data: false
  change_permissions_or_gate_policy: false

sensitive_change_classes:
  - authentication_or_authorization
  - payments
  - destructive_data_operations
  - database_migrations
  - production_secrets
  - public_api_compatibility
  - ci_or_gate_configuration
  - irreversible_release

release:
  trusted_executor_reference: null
  environments: []
  artifact_provenance_source: null
  observation_checks: []
  observation_window_seconds: null
  recovery_runbook_reference: null
  rollback_reversibility_verified: false

approvals:
  grant_source: null
  grant_expiry: null
  revocation_source: null
  kill_switch_reference: null

# Empty commands/checks/environments do NOT mean permissive defaults.
# They mean incomplete setup. No credentials or self-authored approved=true flag.
