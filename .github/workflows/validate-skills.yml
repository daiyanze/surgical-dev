name: Validate Skills distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dev dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify standalone Skill references
        run: npm run sync:check
      - name: Generate checksums
        if: runner.os == 'Linux'
        run: git ls-files -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload checksums
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS
      - name: Verify package tests
        run: npm test
      - name: Install pinned Pi host for integration check
        run: npm install --prefix "$RUNNER_TEMP/surgical-pi" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.2
      - name: Verify actual Pi lifecycle with a local model fixture
        run: SURGICAL_PI_EXECUTABLE="$RUNNER_TEMP/surgical-pi/node_modules/.bin/pi" npm run test:pi-host
