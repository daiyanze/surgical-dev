name: Validate Skills distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Verify standalone Skill references
        run: python scripts/sync_skill_references.py --check
      - name: Verify checksums are current
        run: |
          git ls-files -z ':!SHA256SUMS' | xargs -0 sha256sum > SHA256SUMS
          test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }
      - name: Verify package tests
        run: npm test
      - name: Verify contract tests
        run: python tests/contracts_test.py
      - name: Install pinned Pi host for integration check
        run: npm install --prefix "$RUNNER_TEMP/surgical-pi" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.2
      - name: Verify actual Pi lifecycle with a local model fixture
        run: SURGICAL_PI_EXECUTABLE="$RUNNER_TEMP/surgical-pi/node_modules/.bin/pi" npm run test:pi-host
