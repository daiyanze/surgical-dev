name: Validate Skills distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify standalone Skill references
        run: python3 scripts/sync_skill_references.py --check
      - name: Verify canonical Grok exports
        run: |
          python3 scripts/export_grok_skills.py
          git diff --exit-code
      - name: Verify package tests
        run: npm test
